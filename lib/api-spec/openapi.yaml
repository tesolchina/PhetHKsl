openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulations
    description: Simulation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /simulations:
    get:
      operationId: listSimulations
      tags: [simulations]
      summary: List simulations
      description: Returns a list of simulations with optional filtering
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: gradeLevel
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of simulations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulationItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GuideStep:
      type: object
      properties:
        title:
          type: object
          properties:
            en:
              type: string
            zh:
              type: string
          required:
            - en
            - zh
        content:
          type: object
          properties:
            en:
              type: string
            zh:
              type: string
          required:
            - en
            - zh
      required:
        - title
        - content
    CurriculumMapping:
      type: object
      properties:
        standard:
          type: string
        region:
          type: string
        grade:
          type: string
        subject:
          type: string
        topic:
          type: string
        description:
          type: string
      required:
        - standard
        - region
        - grade
        - subject
        - topic
        - description
    SimulationItem:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        nameEn:
          type: string
        nameZh:
          type: string
        descriptionEn:
          type: string
        descriptionZh:
          type: string
        category:
          type: string
        gradeLevel:
          type: string
        tagsEn:
          type: array
          items:
            type: string
        tagsZh:
          type: array
          items:
            type: string
        urlEn:
          type: string
        urlZh:
          type: string
        githubRepoUrl:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        hasChineseLocalization:
          type: boolean
        isFeatured:
          type: boolean
        localDev:
          type: boolean
        customRoute:
          type: string
          nullable: true
        guide:
          type: array
          items:
            $ref: "#/components/schemas/GuideStep"
        curriculumMappings:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumMapping"
      required:
        - id
        - slug
        - nameEn
        - nameZh
        - descriptionEn
        - descriptionZh
        - category
        - gradeLevel
        - tagsEn
        - tagsZh
        - urlEn
        - urlZh
        - hasChineseLocalization
        - isFeatured
        - localDev
        - guide
        - curriculumMappings
