kind = "web"
previewPath = "/"
title = "PhET Simulations"
version = "1.0.0"
id = "artifacts/phet-sims"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20435

[services.development]
run = "pnpm --filter @workspace/phet-sims run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/phet-sims", "run", "build" ]
publicDir = "artifacts/phet-sims/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20435"
BASE_PATH = "/"
